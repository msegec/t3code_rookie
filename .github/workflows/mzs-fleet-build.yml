name: Legacy MZS fleet build

on:
  workflow_dispatch:
    inputs:
      nightly_tag:
        description: Official nightly tag
        required: false
        type: string
      controls_sha:
        description: Legacy fleet controls commit
        required: true
        type: string
      release_tag:
        description: Legacy release identity
        required: true
        type: string

permissions: {}

concurrency:
  group: mzs-t3-fleet-build
  cancel-in-progress: false

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require compatible hosted controls
        run: |
          echo 'Standalone fleet releases build locally with t3-fleet-release build-local.' >&2
          echo 'Legacy paid builds require the explicitly approved legacy workflow ref and matching controls SHA.' >&2
          exit 1
