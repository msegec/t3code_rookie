name: MZS fleet hosted build

# Builds one reviewed fleet source on free public-repository runners with
# upstream's release-desktop.yml, pinned to that source. It only uploads run
# artifacts: assembly, review and publication happen locally afterwards.

on:
  workflow_dispatch:
    inputs:
      fleet_metadata:
        description: Base64 mzs-fleet.json for FLEET_VERSION and FLEET_SOURCE_SHA
        required: true
        type: string

permissions:
  # The Windows jobs read this run's artifact list to wait for the Linux CLI archive.
  actions: read
  contents: read

concurrency:
  group: mzs-t3-fleet-hosted-build
  cancel-in-progress: false

env:
  FLEET_VERSION: 0.1.6-nightly.20261029.3892.mzs.r590751c05cb0
  FLEET_SOURCE_SHA: 75336f0d0e8082907992176951115f99e42fcdb5

jobs:
  resolve:
    name: Resolve fleet source
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ env.FLEET_VERSION }}
      ref: ${{ env.FLEET_SOURCE_SHA }}
    steps:
      - name: Check fleet metadata
        shell: bash
        env:
          FLEET_METADATA: ${{ inputs.fleet_metadata }}
        run: |
          set -euo pipefail
          metadata="$(base64 --decode <<<"$FLEET_METADATA")"
          jq -e --arg version "$FLEET_VERSION" --arg sha "$FLEET_SOURCE_SHA" \
            '.schemaVersion == 1 and .version == $version and .releaseTag == "v" + $version and .sourceSha == $sha' \
            <<<"$metadata" >/dev/null

  build_bundle:
    name: Build JS bundle
    needs: [resolve]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VITE_MZS_FLEET_LABEL: MZS Fleet
      T3CODE_TELEMETRY_CHANNEL: dev
    steps:
      # Same as release-desktop.yml: actions/checkout's credential cleanup runs
      # submodule foreach, which fails on the orphaned gitlinks under .repos.
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ needs.resolve.outputs.ref }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.resolve.outputs.version }}"

      - uses: ./.github/actions/setup-apt-mirrors

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        run: vp run build:desktop

      # The CLI archive copies this beside its server bundle as provenance.
      - name: Stage fleet metadata
        shell: bash
        env:
          FLEET_METADATA: ${{ inputs.fleet_metadata }}
        run: base64 --decode <<<"$FLEET_METADATA" > apps/server/dist/mzs-fleet.json

      - name: Upload JS bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  # Same targets as upstream release.yml, on standard GitHub-hosted runners and
  # without signing secrets, so every build is unsigned or ad hoc.
  desktop_mac_arm64:
    name: Desktop macOS arm64
    needs: [resolve, build_bundle]
    uses: msegec/t3code_rookie/.github/workflows/release-desktop.yml@75336f0d0e8082907992176951115f99e42fcdb5
    with:
      version: ${{ needs.resolve.outputs.version }}
      ref: ${{ needs.resolve.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: macOS arm64
      runner: macos-15
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: true
      launch_check: true

  desktop_mac_x64:
    name: Desktop macOS x64
    needs: [resolve, build_bundle]
    uses: msegec/t3code_rookie/.github/workflows/release-desktop.yml@75336f0d0e8082907992176951115f99e42fcdb5
    with:
      version: ${{ needs.resolve.outputs.version }}
      ref: ${{ needs.resolve.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: macOS x64
      runner: macos-15
      platform: mac
      target: dmg
      arch: x64
      rust_target: x86_64-apple-darwin
      resource_key: darwin-x64
      cli_archive: false

  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [resolve, build_bundle]
    uses: msegec/t3code_rookie/.github/workflows/release-desktop.yml@75336f0d0e8082907992176951115f99e42fcdb5
    with:
      version: ${{ needs.resolve.outputs.version }}
      ref: ${{ needs.resolve.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      launch_check: true

  desktop_linux_arm64:
    name: Desktop Linux arm64
    needs: [resolve, build_bundle]
    uses: msegec/t3code_rookie/.github/workflows/release-desktop.yml@75336f0d0e8082907992176951115f99e42fcdb5
    with:
      version: ${{ needs.resolve.outputs.version }}
      ref: ${{ needs.resolve.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Linux arm64
      runner: ubuntu-24.04-arm
      platform: linux
      target: AppImage
      arch: arm64
      rust_target: aarch64-unknown-linux-gnu
      resource_key: linux-arm64
      cli_archive: true

  desktop_win_x64:
    name: Desktop Windows x64
    needs: [resolve, build_bundle]
    uses: msegec/t3code_rookie/.github/workflows/release-desktop.yml@75336f0d0e8082907992176951115f99e42fcdb5
    with:
      version: ${{ needs.resolve.outputs.version }}
      ref: ${{ needs.resolve.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: true

  desktop_win_arm64:
    name: Desktop Windows arm64
    needs: [resolve, build_bundle]
    uses: msegec/t3code_rookie/.github/workflows/release-desktop.yml@75336f0d0e8082907992176951115f99e42fcdb5
    with:
      version: ${{ needs.resolve.outputs.version }}
      ref: ${{ needs.resolve.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Windows arm64
      runner: ubuntu-24.04
      verify_runner: windows-11-arm
      platform: win
      target: nsis
      arch: arm64
      rust_target: aarch64-pc-windows-msvc
      resource_key: win32-arm64
      cli_archive: true
